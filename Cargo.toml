[workspace]
members = [
  "crates/domain",
  "crates/provider-core",
  "crates/provider-2gis",
  "crates/provider-public-catalogs",
  "crates/dedupe",
  "crates/storage-sqlite",
  "crates/export",
  "crates/application",
  "apps/desktop/src-tauri",
  "apps/cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.4.5"
rust-version = "1.96"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1.3"
futures = "0.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "gzip", "brotli", "deflate", "cookies"] }
rust_xlsxwriter = "0.89"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
