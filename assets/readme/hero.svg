<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Lead Aggregator</title>
  <desc id="desc">Кроссплатформенное desktop-приложение собирает карточки компаний из каталогов, объединяет совпадения и сохраняет список локально.</desc>
  <rect width="1200" height="340" rx="26" fill="#101216"/>
  <path d="M548 36v268" stroke="#2b3038"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="58" y="66" fill="#9aa2af" font-size="18" font-weight="600">КРОССПЛАТФОРМЕННОЕ DESKTOP-ПРИЛОЖЕНИЕ</text>
    <text x="58" y="132" fill="#f2f4f7" font-size="54" font-weight="700" letter-spacing="-1.8">Lead Aggregator</text>
    <text x="60" y="181" fill="#c4cad3" font-size="23">Соберите карточки компаний</text>
    <text x="60" y="213" fill="#c4cad3" font-size="23">в один список — и сохраните его.</text>
    <g fill="#9aa2af" font-size="17">
      <text x="60" y="279">2ГИС · Yell · Zoon · Rusprofile</text>
      <text x="60" y="306">CSV · Excel · JSON</text>
    </g>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="596" y="53" fill="#9aa2af" font-size="16" font-weight="600">КАРТОЧКИ ИЗ КАТАЛОГОВ</text>
    <g fill="#191d23" stroke="#343a44">
      <rect x="596" y="76" width="170" height="52" rx="11"/>
      <rect x="596" y="143" width="170" height="52" rx="11"/>
      <rect x="596" y="210" width="170" height="52" rx="11"/>
    </g>
    <g fill="#f2f4f7" font-size="19" font-weight="600">
      <text x="618" y="109">2ГИС</text>
      <text x="618" y="176">Yell</text>
      <text x="618" y="243">Zoon</text>
    </g>
    <path d="M766 102h43q22 0 22 22v33q0 23 22 23h17M766 169h104M766 236h43q22 0 22-22v-33q0-23 22-23" fill="none" stroke="#64d29a" stroke-width="2"/>
    <circle cx="872" cy="180" r="6" fill="#64d29a"/>
    <rect x="880" y="104" width="268" height="151" rx="15" fill="#191d23" stroke="#3a414b"/>
    <text x="904" y="136" fill="#9aa2af" font-size="15" font-weight="600">ОБЩИЙ СПИСОК</text>
    <path d="M904 151h220" stroke="#343a44"/>
    <circle cx="914" cy="177" r="5" fill="#64d29a"/>
    <text x="930" y="183" fill="#f2f4f7" font-size="17" font-weight="600">Название и адрес</text>
    <text x="930" y="204" fill="#9aa2af" font-size="14">источники сохранены</text>
    <circle cx="914" cy="228" r="5" fill="#77808e"/>
    <text x="930" y="234" fill="#c4cad3" font-size="15">CSV   XLSX   JSON</text>
