name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-15
            bundles: app,dmg
            artifact: target/release/bundle/dmg/*.dmg
          - platform: Linux
            runner: ubuntu-24.04
            bundles: deb,appimage
            artifact: target/release/bundle/deb/*.deb
          - platform: Windows
            runner: windows-latest
            bundles: msi
            artifact: target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          packages=(
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
          )
          options=(--yes --no-install-recommends --no-install-suggests)
          # A slow but active Azure mirror never reaches apt's network timeout.
          if ! timeout -k 5s 30s sudo apt-get update ||
             ! timeout -k 5s 45s sudo apt-get install --download-only "${options[@]}" "${packages[@]}"; then
            echo "::warning::APT update/download stalled or failed; trying archive.ubuntu.com"
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n' |
              sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            timeout -k 5s 30s sudo apt-get update
            timeout -k 5s 90s sudo apt-get install --download-only "${options[@]}" "${packages[@]}"
          fi
          sudo apt-get install --no-download "${options[@]}" "${packages[@]}"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'const version = require("./apps/desktop/src-tauri/tauri.conf.json").version; if (process.env.GITHUB_REF_NAME !== "v" + version) { console.error("Release tag must match the app version"); process.exit(1); }'
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir apps/desktop tauri build --bundles "${{ matrix.bundles }}"
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Lead-Aggregator-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact }}
            target/release/bundle/**/*.sig
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v7
        with:
          pattern: Lead-Aggregator-*
          path: release-assets
          merge-multiple: true
      - name: Flatten signed release assets
        run: |
          mkdir release-assets-flat
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -e "release-assets-flat/$name" ]]; then
              echo "Duplicate release asset: $name" >&2
              exit 1
            fi
            cp "$file" "release-assets-flat/$name"
          done < <(find release-assets -type f -print0)
          rm -rf release-assets
          mv release-assets-flat release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: 1tuz/Lead-Aggregator
          TAG: ${{ github.ref_name }}
        run: |
          if [[ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]]; then
            echo "No successful platform artifacts to release" >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          VERSION="${TAG#v}"
          NOTES="$(gh release view "$TAG" --json body --jq .body)" \
            VERSION="$VERSION" node .github/scripts/compose-updater-manifest.mjs
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false
